<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title description">
  <title id="title">cmachine: run the model, own the state</title>
  <desc id="description">A real C/CUDA chat produces Green, rewinds and regenerates Green exactly, then takes a Yellow branch. A frozen source-covered first-layer operand program matches 6,685,184 FP32 logits over 44 token advances, including eight own generated tokens. Original weights and remaining dense work are retained.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0a2324"/><stop offset="1" stop-color="#16182b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#80e4d0"/><stop offset="1" stop-color="#b6a0fb"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#658f91"/></marker>
  </defs>
  <rect width="1120" height="600" rx="24" fill="url(#background)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="48" y="48" font-size="12" font-weight="700" letter-spacing="2" fill="#84d9cb">CMACHINE / EXECUTABLE MODEL STATE</text>
    <text x="48" y="110" font-size="44" font-weight="750" letter-spacing="-1.5" fill="#eaf8f4">Run the model. <tspan fill="url(#accent)">Own the state.</tspan></text>
    <text x="48" y="147" font-size="19" fill="#adbfbe">Branch a conversation. Replay it exactly. Replace a computation.</text>
    <path d="M245 258 H300 V225 H352 M300 258 V323 H752 M542 225 H584" fill="none" stroke="#658f91" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M704 225 H748" fill="none" stroke="#658f91" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="213" width="197" height="92" rx="14" fill="#163435" stroke="#38585a"/>
    <text x="70" y="241" font-size="12" letter-spacing="1" fill="#9ebbb8">SAVED PARENT</text>
    <text x="70" y="274" font-size="24" font-weight="650" fill="#eaf8f4">Mira's badge</text>
    <rect x="352" y="184" width="190" height="82" rx="14" fill="#123e39" stroke="#528c7d"/>
    <text x="375" y="210" font-size="12" fill="#a4c6be">BRANCH A</text>
    <text x="375" y="245" font-size="28" font-weight="700" fill="#86e2ca">Green</text>
    <text x="579" y="203" font-size="12" fill="#adbfbe">rewind</text>
    <text x="579" y="222" font-size="12" fill="#adbfbe">regenerate</text>
    <rect x="752" y="184" width="320" height="82" rx="14" fill="#123e39" stroke="#528c7d"/>
    <text x="775" y="210" font-size="12" fill="#a4c6be">REPLAY A</text>
    <text x="775" y="245" font-size="28" font-weight="700" fill="#86e2ca">Green</text>
    <text x="896" y="224" font-size="13" fill="#c2e4da">same IDs</text>
    <text x="896" y="244" font-size="13" fill="#c2e4da">cache + logits</text>
    <text x="366" y="314" font-size="12" fill="#adbfbe">rewind / take another branch</text>
    <rect x="752" y="285" width="320" height="78" rx="14" fill="#302a49" stroke="#746392"/>
    <text x="775" y="311" font-size="12" fill="#bdb0d4">BRANCH B / COMMITTED</text>
    <text x="775" y="345" font-size="28" font-weight="700" fill="#ddd0fc">Yellow</text>
    <g fill="#102729" stroke="#294749">
      <rect x="48" y="403" width="325" height="112" rx="14"/>
      <rect x="397" y="403" width="325" height="112" rx="14"/>
      <rect x="746" y="403" width="326" height="112" rx="14"/>
    </g>
    <g fill="#eaf8f4" font-size="36" font-weight="750">
      <text x="71" y="451">44</text><text x="420" y="451">6,685,184</text><text x="769" y="451">8</text>
    </g>
    <g fill="#a9c1bd" font-size="14">
      <text x="71" y="486">exact compiled-operand advances</text>
      <text x="420" y="486">FP32 logits matched native directly</text>
      <text x="769" y="486">own generated tokens consumed</text>
    </g>
    <text x="48" y="548" font-size="13" fill="#acc0bd">Qwen2.5-1.5B-Instruct · RTX 4080 · job-995c8e81e7ca</text>
    <text x="48" y="573" font-size="12" fill="#8da5a3">Source-covered first-layer Q/K/V table; original weights and remaining dense computation retained. No speedup claim.</text>
  </g>
</svg>
